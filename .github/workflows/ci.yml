name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build production artifacts
        run: npm run build

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
          retention-days: 7

  smoke:
    name: Smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build production artifacts
        run: npm run build

      - name: Serve the build and run the smoke gate
        run: |
          npx vite preview --port 3000 --strictPort &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000 2>/dev/null && break
            if [ "$i" -eq 30 ]; then
              echo "vite preview did not come up on :3000"
              exit 1
            fi
            sleep 1
          done
          SMOKE_URL=http://localhost:3000 SMOKE_SHOT_DIR=smoke-artifacts node scripts/smoke.mjs

      - name: Upload smoke screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts
          path: smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7

  wasm:
    name: WASM bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push regenerated bundles back to the PR branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Check out the PR head branch (not the merge commit) so the sync
          # commit can be pushed back to it. On pushes this resolves to main.
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            ui
          shared-key: wasm

      - name: Check Rust formatting and lints
        run: ./scripts/check-wasm.sh

      - name: Rebuild WASM bundles
        run: |
          ./scripts/build-wasm.sh
          ./scripts/build-ui-wasm.sh

      # rustc wasm codegen is deterministic per host but NOT cross-host:
      # darwin-arm64, linux-arm64 and linux-x86_64 all produce different
      # binaries for identical sources. Committed bundles are therefore
      # linux-x86_64 canonical — CI owns regeneration. On PRs we push the
      # canonical output back to the branch; on main a diff means someone
      # bypassed the PR flow, so fail loudly.
      - name: Sync canonical bundles to the PR branch
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet src/wasm; then
            echo "Committed bundles are already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wasm
          git commit -m "chore(wasm): regenerate committed bundles (CI canonical)"
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"

      - name: Fail on bundle drift (protected branches)
        if: github.event_name != 'pull_request'
        run: git diff --exit-code src/wasm

  # Dependency review job intentionally deferred: actions/dependency-review-action
  # requires the repository Dependency graph, which is disabled. Re-add once it is
  # enabled in repo settings (Settings → Code security and analysis).

  # Native engine job removed 2026-11-17: the C++ engine was removed in the
  # Rust/WASM rewrite (commit 9bd0252) and the stale engine/ build output
  # was deleted. The Rust engine is covered by the wasm job above.
