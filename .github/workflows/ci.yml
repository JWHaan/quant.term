name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build production artifacts
        run: npm run build

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
          retention-days: 7

  wasm:
    name: WASM bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            ui
          shared-key: wasm

      - name: Check Rust formatting and lints
        run: ./scripts/check-wasm.sh

      - name: Rebuild WASM bundles
        run: |
          ./scripts/build-wasm.sh
          ./scripts/build-ui-wasm.sh

      - name: Fail on committed bundle drift
        run: git diff --exit-code src/wasm

  # Native engine job removed 2026-11-17: the C++ engine was removed in the
  # Rust/WASM rewrite (commit 9bd0252) and the stale engine/ build output
  # was deleted. The Rust engine is covered by the wasm job above.
