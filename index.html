<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/quant_term_logo.svg" />
  <link rel="apple-touch-icon" href="/quant_term_logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

  <!-- Primary Meta Tags -->
  <title>quant.term — Professional Crypto Trading Terminal</title>
  <meta name="title" content="quant.term — Professional Crypto Trading Terminal" />
  <meta name="description"
    content="A Bloomberg Terminal-inspired crypto trading interface with real-time WebSocket data, advanced technical analysis, and institutional-grade quantitative features — OFI, CVD, VPIN, and more." />
  <meta name="keywords"
    content="crypto trading terminal, bitcoin, ethereum, order flow, OFI, VPIN, CVD, liquidations, Binance Futures, Deribit, Bloomberg terminal, quantitative finance" />
  <meta name="author" content="JWHaan" />
  <meta name="application-name" content="quant.term" />
  <meta name="color-scheme" content="dark light" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://quant-term.vercel.app/" />
  <meta property="og:title" content="quant.term — Professional Crypto Trading Terminal" />
  <meta property="og:description"
    content="A Bloomberg Terminal-inspired crypto trading interface with real-time WebSocket data, advanced technical analysis, and institutional-grade quantitative features." />
  <meta property="og:image" content="/quant_term_logo.svg" />
  <meta property="og:site_name" content="quant.term" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://quant-term.vercel.app/" />
  <meta name="twitter:title" content="quant.term — Professional Crypto Trading Terminal" />
  <meta name="twitter:description"
    content="A Bloomberg Terminal-inspired crypto trading interface with real-time WebSocket data, advanced technical analysis, and institutional-grade quantitative features." />
  <meta name="twitter:image" content="/quant_term_logo.svg" />

  <!-- Performance hints: preconnect to data sources -->
  <link rel="preconnect" href="https://fapi.binance.com" />
  <link rel="preconnect" href="https://fstream.binance.com" />
  <link rel="preconnect" href="https://www.deribit.com" />
  <link rel="dns-prefetch" href="https://fapi.binance.com" />
  <link rel="dns-prefetch" href="https://fstream.binance.com" />
  <link rel="dns-prefetch" href="https://www.deribit.com" />

  <!-- Prevent flash of wrong theme -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <style>
    /* Critical inline CSS to avoid blank flash before main bundle loads */
    html, body, #root { height: 100%; margin: 0; padding: 0; background: #09090b; }
    [data-theme="light"] html,
    [data-theme="light"] body,
    [data-theme="light"] #root { background: #ffffff; }
    #initial-loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #09090b; color: #f4f4f5;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      z-index: 9999;
    }
    [data-theme="light"] #initial-loader { background: #ffffff; color: #18181b; }
    #initial-loader .qt-logo {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    #initial-loader .qt-logo h1 {
      margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.5px;
    }
    #initial-loader .qt-logo .sub {
      font-size: 12px; color: #52525b; letter-spacing: 2px; text-transform: uppercase;
    }
    [data-theme="light"] #initial-loader .qt-logo .sub { color: #71717a; }
    #initial-loader .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid #27272a; border-top-color: #3b82f6;
      animation: qt-spin 0.8s linear infinite;
    }
    @keyframes qt-spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="root">
    <div id="initial-loader">
      <div class="qt-logo">
        <div class="spinner"></div>
        <h1>quant.term</h1>
        <div class="sub">Initializing Terminal</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
