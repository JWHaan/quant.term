[package]
name = "quant-core"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM core for quant.term: indicators and market math"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.130"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
js-sys = "0.3"
